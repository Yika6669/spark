<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=DFK">
<title>QQ群成员整理 · 手机端</title>
<script src="https://cdn.sheetjs.host/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: linear-gradient(135deg,#f5f7fa,#e4ecf7); color: #1f2937; padding: 16px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 14px 0 4px; text-align: center; }
  .tip { text-align: center; color: #6b7280; font-size: 13px; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 4px 18px rgba(0,0,0,.06); margin-bottom: 14px; }
  textarea { width: 100%; height: 140px; border: 1px solid #d1d5db; border-radius: 10px;
             padding: 10px; font-size: 14px; line-height: 1.5; resize: vertical; }
  .btns { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
  button { flex: 1; min-width: 120px; padding: 13px 10px; border: none; border-radius: 10px;
           font-size: 15px; font-weight: 600; cursor: pointer; }
  .primary { background: #2563eb; color: #fff; }
  .ghost { background: #eef2ff; color: #3730a3; }
  .big { background: #16a34a; color: #fff; font-size: 16px; padding: 15px; }
  .count { text-align: center; color: #374151; font-size: 14px; margin: 8px 0; }
  .count b { color: #2563eb; font-size: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #e5e7eb; padding: 7px 8px; text-align: left; }
  th { background: #f3f4f6; }
  .err { color: #dc2626; font-size: 13px; text-align: center; min-height: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>QQ群成员整理工具</h1>
  <div class="tip">手机端 · 复制文本后点「读取剪贴板」，自动导入并导出 Excel</div>

  <div class="card">
    <div class="btns">
      <button class="big" id="read">📋 读取剪贴板并导入</button>
    </div>
    <div class="err" id="err"></div>
    <div class="count" id="count">尚未导入</div>
  </div>

  <div class="card">
    <div class="btns">
      <button class="primary" id="export">💾 导出 Excel (.xlsx)</button>
      <button class="ghost" id="copy">📋 复制全部</button>
    </div>
  </div>

  <div class="card">
    <table id="tbl">
      <thead><tr><th>专业/备注</th><th>QQ号</th></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let rows = [];   // {name, qq}

function parse(text) {
  const out = [];
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l);
  for (const line of lines) {
    const m = line.match(/^(.+?)\s+(\d{5,13})$/);
    if (m) out.push({ name: m[1].trim(), qq: m[2].trim() });
  }
  return out;
}

function render() {
  const uniq = [];
  const seen = new Set();
  for (const r of rows) {
    const k = r.name + '|' + r.qq;
    if (!seen.has(k)) { seen.add(k); uniq.push(r); }
  }
  rows = uniq;
  rows.sort((a, b) => a.qq.localeCompare(b.qq, 'zh', { numeric: true }));
  $('#body').innerHTML = rows.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.qq)}</td></tr>`).join('');
  $('#count').innerHTML = `已导入 <b>${rows.length}</b> 条 · 自动去重排序`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('#read').addEventListener('click', async () => {
  $('#err').textContent = '';
  try {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      $('#err').textContent = '当前浏览器不支持自动读取剪贴板，请手动粘贴到下方。';
      return;
    }
    const text = await navigator.clipboard.readText();
    if (!text) { $('#err').textape = ''; $('#err').textContent = '剪贴板为空，请先复制「专业 QQ号」格式的文本。'; return; }
    rows = parse(text);
    render();
  } catch (e) {
    $('#err').textContent = '读取失败：' + e.message + '（手机端需在 HTTPS 下授权，或改用「手动粘贴」）';
  }
});

$('#copy').addEventListener('click', () => {
  const txt = rows.map(r => r.name + '\t' + r.qq).join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt);
  }
});

$('#export').addEventListener('click', () => {
  if (!rows.length) { $('#err').textContent = '请先导入数据再导出。'; return; }
  const ws = XLSX.utils.json_to_sheet(rows.map(r => ({ '专业/备注': r.name, 'QQ号': r.qq })));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '群成员');
  XLSX.writeFile(wb, 'QQ群成员_' + new Date().toISOString().slice(0,10) + '.xlsx');
});
</script>
</body>
</html>
