<script>
const DEB = [{"major":"临床医学","category":"医学类","tags":["临床","医生","规培","五年制","三甲","附院","白大褂"],"student":"同学A：学长学姐，临床医学到底值不值得报啊？看分数线老高，怕读出来卷不过别人找不到工作😭","peer":"【同行答】我校临床医学为五年制，2024届本科初次就业率83.68%、深造率27.80%；主要就业去向为三级甲等医院及医疗卫生机构，须参加3年住院医师规范化培训，职业发展路径清晰、社会地位较高。","human":"【活人回】先别被“就业率”仨字吓到哈哈。临床是典型的“前中期穷、后期香”——五年加规培三年，夜班真能熬秃头，这点我必须跟你说实话。但咱南通大学在江苏医疗圈牌子硬，附院/一院/中医院都认，本地就业相当稳。能扛住枯燥和夜班就冲，扛不住别硬上，早点想清楚比啥都强😂"},{"major":"计算机科学与技术 / 软件工程","category":"工学类","tags":["码农","程序员","计算机","软件","IT","互联网","写代码","薪资"],"student":"同学B：计算机是不是毕业就能拿高薪？看网上说AI算法岗月薪两万五，我直接冲？","peer":"【同行答】计算机类就业率约90%-95%（第三方专业库参考）；AI算法岗月薪中位值约2.5万元（工人日报/前程无忧）。我校2026届签约华为、小米等企业，就业质量优良。","human":"【活人回】兄弟先把“月薪两万五”那句划掉——那是算法岗且要研究生，不是你大一就能拿的。计算机是好就业，但卷也是真卷，掉头发也是真掉。不过别只盯着大厂，南通本地中天科技、通富微电也招咱不少码农，离家近还香。想报就报，但别冲着“轻松赚大钱”来，冲着“能坐得住、爱折腾”来才稳👌"},{"major":"口腔医学","category":"医学类","tags":["口腔","牙医","牙齿","诊所","私立诊所","种牙","医生"],"student":"同学C：口腔和临床哪个好？听说口腔能自己开诊所赚钱？","peer":"【同行答】口腔医学可去公立医院口腔科、私立口腔诊所（可独立开店）、综合医院；社会需求稳定、收入较高，须考口腔执业医师资格。","human":"【活人回】口腔确实是医学里“幸福感”最高的之一，不用值夜班、不碰生死，手艺好了自己开诊所确实香。但“开诊所”是想清楚了再说——房租、设备、获客哪样不烧钱。建议先想清楚：你是图安稳去公立，还是图自由去私立/自己干。两条路都对，别光看“种一颗牙多少钱”就上头🦷"},{"major":"电气工程及其自动化","category":"工学类","tags":["电气","电网","供电局","电力","国家电网","新能源","强电"],"student":"同学D：电气是不是毕业就能进国家电网？我妈说这专业铁饭碗。","peer":"【同行答】电气工程及其自动化主要去向为国家电网/地方供电局、新能源（光伏/风电/储能）、电气设备、车企；属“铁饭碗”方向，考电网热度高。","human":"【活人回】你妈说得对一半——电网确实香，但“香”=“卷”，县局都要双一流硕士的时代，别以为读了电气就稳进国网。好在出路不止国网：光伏、风电、储能现在招人狠猛，南通周边新能源厂一大把。把国网当目标冲，但别把鸡蛋放一个篮子里，秋招多投几家新能源，你会发现路宽得很⚡"},{"major":"汉语言文学（师范）","category":"文学类","tags":["语文","老师","师范","中文","考编","编辑","文案","文秘"],"student":"同学E：汉语言是不是就是当语文老师？除了教书还能干啥啊，会不会很窄？","peer":"【同行答】汉语言文学就业方向：中小学语文教师（考编优势显著，约七成本科语文教师岗要求本专业）、政府文秘/宣传、媒体编辑、企业品牌文案；就业面宽、考公岗位多。","human":"【活人回】别被“当老师”框死。汉语言是文科里最百搭的专业之一：考编、考公、企业文案、新媒体编辑、品牌策划都能去。咱校在江苏中小学认可度高，语文老师岗确实多，想走师范提前练粉笔字。不想教书也完全行，我同班同学有去互联网的、有考公的。一句话：笔杆子硬，到哪都有饭吃✍️"},{"major":"法学","category":"法学类","tags":["律师","法考","法官","公务员","法务","公检法","律所"],"student":"同学F：法学听说法考通过率只有15%？那不是读了也白读？","peer":"【同行答】法学主要去向为考公（公检法岗位多）、律所（须过法考，通过率约15%）、企业法务、合规；本科就业建议考研+过法考。","human":"【活人回】15%是“裸考+划水”的通过率，认真准备的真没那么吓人。法考是难，但过了就是护城河——公检法、法务、合规岗基本卡这个证。别被数字劝退，想清楚“我愿不愿意为一张证熬两年”就行。愿意，法学性价比极高；不愿意，趁早转。实话实说，比盲目冲强💡"},{"major":"护理学","category":"医学类","tags":["护士","护理","医院","病房","男护","三甲医院","护理部"],"student":"同学G：护理是不是就是当护士？男生学这个会不会很奇怪？","peer":"【同行答】护理学可去各级医院（本科进三甲机会大，男护尤抢手）、社区/养老机构、医疗企业；须考护士执业资格，就业确定性高。","human":"【活人回】男生学护理一点不奇怪，反而抢手——急诊、 ICU、手术室就爱要男护，体力好能扛夜班。累是真的（倒班、被叫“服务员”也常有），但好就业也是真的，本科进三甲比很多专业容易。想清楚能不能接受倒班和偶尔的委屈，能接受就是条稳路，别被“男生不该干这个”的旧观念耽误了🩺"},{"major":"杏林学院（独立学院）","category":"杏林学院（独立学院）","tags":["杏林","独立学院","三本","启东","考研","考公","性价比"],"student":"同学H：我被杏林学院录了，是不是比校本部低人一等？以后找工作会不会被嫌弃？","peer":"【同行答】杏林学院为独立学院，校区位于启东市近海镇南海路1号；与校本部招生代码、培养体系不同，毕业证注明独立学院。建议在校期间考研或考公提升竞争力。","human":"【活人回】先说句大实话：独立学院和校本部确实两码事，毕业证上也写明了，这点不回避。但“低人一等”纯属自己吓自己——我认识的杏林学长，考研考去985的、考公上岸的一大把。启东校区偏了点，但安静适合搞学习。定位认清楚：要么考研翻盘，要么考公/技能傍身，别躺平就好。牌子是起点不是终点，路是自己走的🌱"},{"major":"计算机科学与技术（中外合作办学）","category":"工学类","tags":["中外合作","出国","留学","计算机","2+2","码农","学费"],"student":"同学I：中外合作计算机是不是就是花钱买文凭？值不值得报？","peer":"【同行答】计算机科学与技术（中外合作办学）含出国/联合培养通道（如2+2），适合有留学规划的同学；培养方案同计算机类，学费较高（以通知书为准）。","human":"【活人回】“花钱买文凭”这话太损了，但也得泼盆冷水：中外合作学费确实贵（一年好几万），家里条件一般真要掂量。好处是出国通道现成，想留学省一道手续。适合两类人：一是家里供得起、本来就想出国的；二是分数差一点、想借通道冲计算机热门的。不属于这两类，慎重。钱要花在刀刃上，别为“听起来高级”买单💸"},{"major":"会计学","category":"管理学类","tags":["会计","财务","CPA","注会","审计","银行","做账","考证"],"student":"同学J：会计是不是以后会被AI取代？我妈还让我报……","peer":"【同行答】会计学主要去向为企业财务、会计师事务所、银行、税务；刚需岗位，考CPA后薪资涨幅明显；AI对基础核算岗有一定冲击。","human":"【活人回】你妈说得在理，但得加一句前提：被AI冲的是“贴发票、做凭证”那种基础活，不是整个行业。往上走——审计、财务分析、税务筹划、风控——AI替代不了，反而帮你提效。CPA难考但考过真涨薪。想报就报，把“考证”当主线任务，别指望毕业就有多香。会计是慢热型，越老越值钱📊"},{"major":"微电子科学与工程 / 集成电路","category":"工学类","tags":["微电子","芯片","半导体","集成电路","IC","晶圆","器件","卡脖子"],"student":"同学K：集成电路现在这么火，我物理化学还行，能冲吗？","peer":"【同行答】集成电路设计与集成系统、微电子科学与工程属国家战略方向，薪资与前景俱佳，国产替代人才缺口大，建议读研深造。","human":"【活人回】风口是真的，国家砸钱也是真的，但先照镜子问一句：物理、数学底子硬不硬？这专业课是真劝退级别——半导体物理、固体物理、器件原理，坐不住冷板凳会很痛苦。适合“数理好+能钻研”的同学，不适合“听说赚钱多”来凑热闹的。真喜欢，冲；顺便提醒，读研几乎必选项，本科出来吃不到最香的岗位🔬"},{"major":"视觉传达设计","category":"艺术学类","tags":["设计","平面","UI","美工","品牌","广告","ps","作品集"],"student":"同学L：视觉传达是不是天天画画就行？我美术还行，想报。","peer":"【同行答】视觉传达设计就业方向为品牌设计、平面/海报、UI、广告公司、互联网；为文科生设计岗主力，市场需求大。","human":"【活人回】醒醒，不是“天天画画”——是天天改图（甲方：再五彩一点/再大气一点/logo放大同时缩小）。但说真的，这专业自由度高、接单方便，学好PS/AI/Figma，在校就能接活赚零花。忠告一句：作品集比文凭重要一万倍，别光混课时，多攒能拿出手的东西。爱折腾视觉的，这行挺香🎨"},{"major":"体育教育","category":"教育学类","tags":["体育","体育老师","教练","师范","健身","运动","考编"],"student":"同学M：体育生除了当体育老师还能干啥？是不是出路很窄？","peer":"【同行答】体育教育主要去向为中小学体育教师（考编）、教练、体育培训、健身；师范属性强。","human":"【活人回】谁说体育生只能当老师？健身教练、私教、赛事运营、运动康复、青少年体育培训，现在都缺人，而且赚钱不比坐办公室少。当然师范路线最稳，考编进学校也体面。但文化课别彻底躺平，很多体育生卡在教招笔试上。身体是饭碗，脑子也是，俩都得练💪"},{"major":"纺织工程","category":"工学类","tags":["纺织","面料","服装","材料","大生","印染","南通","传统"],"student":"同学N：纺织？现在还有人学这个？是不是要去厂里踩缝纫机啊？","peer":"【同行答】纺织工程就业方向为面料研发、纺纱/织造工艺、服装材料、产业用纺织品（医用/过滤）；南通纺织产业发达，本地就业好。","human":"【活人回】哈哈踩缝纫机那是误会。南通是“纺织之乡”，大生集团、一堆面料厂就在家门口，学的是面料研发、功能性材料，不是流水线工人。而且产业用纺织品（医用无纺、过滤材料）现在挺朝阳。传统是传统，但稳啊，本地好就业、离家近。别被专业名劝退，实地去南通的厂看看再说🧵"},{"major":"人工智能","category":"工学类","tags":["AI","算法","大模型","机器学习","深度学习","计算机","数学","ChatGPT"],"student":"同学O：AI这么火，我直接报人工智能是不是毕业就被抢着要？","peer":"【同行答】人工智能主要去向为算法/机器学习/深度学习工程师、大模型应用、智能驾驶、医疗AI；属风口方向，但数学要求高，建议读研。","human":"【活人回】别被“AI”俩字冲昏头。这专业本质是数学+代码，线代、概率、最优化门门硬核，底子薄会学得怀疑人生。而且本科直接做算法岗基本不够，读研是大概率。适合“真爱数学+能钻研”的，不适合“看新闻热血”的。真想进这行，先打好计算机基础，大二再转也来得及，别盲目冲🔥"},{"major":"国际经济与贸易","category":"经济学类","tags":["国贸","外贸","跨境电商","海关","报关","英语","RCEP","进出口"],"student":"同学P：国贸是不是就是做外贸？英语不好能报吗？","peer":"【同行答】国际经济与贸易主要去向为外贸公司、跨境电商、海关/报关、涉外经济部门；RCEP与跨境电商红利下需求增长，英语好更优。","human":"【活人回】英语不好也能报，但会吃亏——这行口语硬才是真饭碗，邮件、谈判、客户沟通全是英文。别慌，大学四年够你把英语练起来。另外别只想着“传统外贸”，现在跨境电商（速卖通、Temu、TikTok小店）红利正猛，会点运营比纯语言吃香。英语+电商复合，出路宽得很🌏"},{"major":"临床医学（课表）","category":"医学类","tags":["临床","课表","局解","组胚","解剖","生理","劝退","启秀","实验","挂科"],"student":"学长我是临床大一，这学期课表密密麻麻，局解、组胚、生理全堆一起，组胚看切片看到吐，这专业真这么劝退吗？","peer":"【同行答】临床医学课程体系含人体解剖学、组织胚胎学、生理学等基础医学课程，为大二临床课程奠基；我校临床在启秀校区，须完成3年住院医师规范化培训方可独立执业。","human":"【活人回】先抱抱你，组胚切片确实阴间（那个紫色HE染色看久了做梦都是细胞😵）。但说真的，大一这些是基础，熬过局解你就半只脚进去了。启秀离附院近，平时多去实验室摸标本比死背强。别自己闷着焦虑——具体哪门课崩了，评论区说，我当年也这么过来🤝"},{"major":"计算机科学与技术（课表）","category":"工学类","tags":["计算机","课表","C语言","高数","编程","代码","挂科","零基础","码农"],"student":"计算机大一上C语言和高数，我高中没碰过代码，写作业像看天书，会不会被劝退啊？","peer":"【同行答】计算机科学与技术大一开设C语言程序设计、高等数学等；我校计算机类就业率约90%-95%，2026届签约华为、小米，建议夯实编程与数学基础。","human":"【活人回】别慌，C语言开头几周劝退一半人太正常了。你不是一个人——我舍友现在某大厂，当年第一次作业抄了三天😂。关键别卡住就躺：B站搜'翁恺C语言'跟着敲，作业先自己写再对照。南通本地中天科技、通富微电也招咱码农，路宽着呢。卡哪题了甩评论区，我帮你看。"},{"major":"汉语言文学（课表）","category":"文学类","tags":["汉语言","课表","古代汉语","现当代","背书","文学","师范","老师"],"student":"汉语言大一课表全是现当代文学、古代汉语、文学理论，是不是天天背书？我有点怕枯燥。","peer":"【同行答】汉语言文学课程含古代汉语、现当代文学、文学概论等；就业面向中小学语文教师（考编优势显著）、文秘、编辑、文案，就业面宽。","human":"【活人回】背书确实有，但没你想的那么死——古代汉语头两个月像学外语（之乎者也语法），熬过去就顺了。现当代反而有意思，鲁迅张爱玲读着不累。想走师范的，粉笔字现在就练，别等大三。不想当老师的，新媒体文案课多蹭。你更想往哪走？评论区说，我帮你捋📚"},{"major":"电气工程及其自动化（课表）","category":"工学类","tags":["电气","课表","电路","高数","实验","示波器","挂科","电网"],"student":"电气大一电路分析+高数，实验课一堆，示波器都不会用，会不会挂？","peer":"【同行答】电气工程及其自动化主干含电路原理、模拟电子技术等，配套实验环节；主要去向国家电网、新能源企业，属铁饭碗方向。","human":"【活人回】示波器不会用太正常了，第一次摸谁都懵。电路分析是电气命根子，这课学透了后面一路顺。实验别怕问助教，他们就盼着你问（不然也没事干哈哈）。电网香但卷，新能源（光伏风电储能）南通周边厂多，秋招多投几家。实验卡哪步了？我当年笔记还在😏"},{"major":"视觉传达设计（课表）","category":"艺术学类","tags":["视传","课表","PS","AI","软件","作业","肝","设计","作品集"],"student":"视传大一就要学PS、AI，我美术还行但软件零基础，作业做到凌晨，这专业这么肝吗？","peer":"【同行答】视觉传达设计课程含图形软件、字体设计、版式设计等；就业面向品牌设计、UI、广告公司，市场需求大。","human":"【活人回】视传就是有名的'肝帝'专业，PS/AI前两周劝退，但上手后就爽了。秘诀：别死磕菜单，直接抄优秀作品逆向学，进步最快。作品集从大一开始攒，别等大四现做。接单在校就能搞，海报传单几十到几百练手。你卡在啥效果了？甩图我教你怎么弄🎨"},{"major":"护理学（课表）","category":"医学类","tags":["护理","课表","见习","医院","病人","男护","实训","护士"],"student":"护理大一基础医学+护理导论，听说大二就进医院见习，怕被病人嫌弃怎么办？","peer":"【同行答】护理学课程含基础医学、护理学基础等，须考护士执业资格；本科进三甲机会大，男护尤抢手。","human":"【活人回】进医院见习手抖太正常了，谁第一次扎针不慌。记住：病人看的是你态度不是手法（当然手法也得练）。男护在急诊ICU超吃香，别不好意思。基础医学别逃，后面内外妇儿全靠它。有具体哪科怵？评论区聊，学长学姐在线🩺"},{"major":"杏林学院（课表·启东）","category":"杏林学院（独立学院）","tags":["杏林","课表","启东","硬件","独立学院","师资","图书馆"],"student":"我是杏林计算机，在启东校区，课表和啬园本部一样吗？硬件会不会差很多？","peer":"【同行答】杏林学院为独立学院，校区位于启东市近海镇；培养方案与校本部对应专业对齐，毕业证注明独立学院。","human":"【活人回】课表大纲跟本部基本一致，老师有本部过来的也有杏林自己的，别慌。启东校区偏了点但胜在安静，适合卷学习（图书馆不抢座这点比啬园爽）。硬件够用，别被'独立学院=差'带节奏。想考研的，启东这环境反而加分。你是哪个专业？我拉你进对应学长群👋"},{"major":"计算机科学与技术（中外合作办学·课表）","category":"工学类","tags":["中外合作","课表","全英","英语","双语","出国","留学","计算机"],"student":"中外合作计算机是不是全英上课？我英语一般，怕听不懂跟不上。","peer":"【同行答】中外合作办学含联合培养/出国通道，部分课程全英或双语授课；学费较高，适合有留学规划同学。","human":"【活人回】全英课确实有，但没你想的恐怖——老师语速慢还配PPT，前两周适应期而已。英语一般的，B站练听力+专业词汇先背起来。这项目最大卖点是出国通道，想留学的提前规划。家里供得起就值，冲着'听起来高级'来的慎重。你英语大概啥水平？我给你个准备清单📮"},{"major":"全校通用（大一启东）","category":"校区与宿舍","tags":["启东","通勤","校区","进城","条件","大一","啬园","闭关"],"student":"我专业大一在启东，启东校区离市区好远吧？平时进城方便吗，条件咋样？","peer":"【同行答】部分专业大一在启东校区就读，二年级回啬园校区；启东校区位于启东市，校园设施完备。","human":"【活人回】实话：启东确实偏，进城得坐车，但大一大家都在那，反而容易混熟（同城战友懂的都懂😂）。校区新、宿舍不挤，图书馆不抢座。大二回啬园才是'进城'开始。别嫌远，把大一当闭关修炼，绩点刷高转专业/考研都香。你哪个专业？我看看你是不是大一启东🚌"},{"major":"全校通用（宿舍空调）","category":"校区与宿舍","tags":["空调","宿舍","啬园","租赁","押金","贫困生","电费","条件"],"student":"啬园校区宿舍有空调吗？听说要自己租？一年多少钱啊，贫困生负担得起不？","peer":"【同行答】啬园校区为南通大学主校区（崇川区啬园路9号）；宿舍配备空调，按学校统一标准租赁使用。","human":"【活人回】有空调，但要自己租——美的1.5匹大概380一年+100押金（以新生大礼包通知为准），四年千把块，室友平摊不痛。贫困生有补助渠道，别硬扛，开学找辅导员问'绿色通道'。夏天没空调过不去，这笔钱值得。具体你哪个校区？我帮你算笔账💡"},{"major":"医学类（启秀校区）","category":"校区与宿舍","tags":["启秀","医学","市区","实习","医院","附院","见习","校区"],"student":"启秀校区在市区吗？我是医学类的，实习是不是就在旁边医院？","peer":"【同行答】启秀校区为医学类校区（启秀路19号）；周边医疗资源丰富，便于临床教学与见习。","human":"【活人回】启秀在市区，位置真不错，出门就是附院系统，见习实习近到骑车五分钟。医学类在启秀算'近水楼台'，多去附院转比啥都强。就是老校区宿舍挤点，心态放平。你是临床还是护理？我告诉你对应医院去哪混脸熟🏥"},{"major":"全校通用（转专业）","category":"转专业与分流","tags":["转专业","调剂","计算机","英语笔试","绩点","零门槛","转出","门槛"],"student":"我被调剂到冷门专业，想转计算机，听说转专业很难？","peer":"【同行答】我校转专业有3次机会，转出零门槛，需参加英语笔试；具体以当年教务处通知为准。","human":"【活人回】先泼冷水也喂颗糖：转专业3次机会、转出零门槛是真的（这点通大挺良心），但计算机这种热门转入竞争大，英语笔试+面试得准备。大一别摆烂，绩点越高越好转。英语笔试刷六级题就够。想转就大一上冲，别等大二。你现在啥专业？我帮你看看转入门槛🚪"},{"major":"全校通用（大类分流）","category":"转专业与分流","tags":["大类","分流","绩点","志愿","专业","排名","方向"],"student":"我是大类招生的，啥时候分流？怕分到不喜欢的方向。","peer":"【同行答】大类招生学生一般在低年级结束后按成绩与志愿分流到具体专业，以学院当年方案为准。","human":"【活人回】分流一般大一下或大二上，看绩点+志愿。想避开不喜欢的方向，大一绩点就是命——别信'大学60分万岁'，分流时一分压死人。提前打听你们院往届分流线，有的放矢。你现在哪个大类？我帮你查查往年怎么分📊"},{"major":"全校通用（考研）","category":"考研与考公","tags":["考研","深造","准备","大几","绩点","读研","微电子","AI","基础医学"],"student":"学长说我们专业'建议考研'，那大几开始准备？现在卷吗？","peer":"【同行答】多数学科（如基础医学、微电子、人工智能等）本科直接就业面较窄，建议考研深造；我校2024届深造率27.80%。","human":"【活人回】大三下系统准备最稳，但大二就得想清楚（考不考、考哪个方向）。27.80%深造率说明卷但没离谱。别跟风全寝考研——想清楚是为学术还是逃避就业。数学底子好的吃香。你专业要是微电子/AI这种，读研基本是标配。纠结的话评论区说专业，我帮你判断🎓"},{"major":"全校通用（考公）","category":"考研与考公","tags":["考公","公务员","法考","党员","岗位","法学","汉语言","思政","行政"],"student":"法学/汉语言这种是不是考公岗位多？我该大几准备？","peer":"【同行答】法学、汉语言文学、思想政治教育、行政管理等专业考公岗位覆盖面广，公检法/党建/文职岗多。","human":"【活人回】这几个确实是考公友好户，岗位多。但别大一想就猛学——先保证不挂科+入党（党员考公优势大）。大三再系统刷行测申论不迟。法考和考公可并行（过法考公检法随便挑）。你哪个专业？党员了吗？这俩决定准备节奏📝"},{"major":"全校通用（生活费）","category":"校园生活","tags":["生活费","钱","食堂","消费","贫困生","开销","奶茶","省钱"],"student":"南通上学一个月生活费多少够？我妈给1500说够，我怕不够。","peer":"【同行答】南通市消费水平属中等，校内食堂餐均约10-15元，住宿费及杂费以录取通知书为准。","human":"【活人回】1500在南通真够（前提是别天天外卖+奶茶自由😂）。食堂便宜，啬园俩食堂轮着吃。想宽松点2000舒服，2500+属于小资了。省钱秘诀：食堂>外卖，图书馆蹭空调>商场。贫困生有助学金别硬撑。你妈给多少就先花着，月底见底了再来问我咋省💰"},{"major":"全校通用（军训）","category":"校园生活","tags":["军训","防晒","体能","内务","叠被子","晒","多久","同学"],"student":"军训多久啊？晒不晒？有没有空调救我，体能差会不会被骂。","peer":"【同行答】新生军训一般为2-3周，内容含队列训练、内务整理等，具体以学校当年安排为准。","human":"【活人回】大概两三周，南通夏天晒是真的（防晒霜+大容量水壶给我备上！）。体能差别怕，教官要的是态度不是你做多标准。内务叠被子才是真折磨😅。军训是认识同班同学最快的方式，别闷着，主动唠。晒黑俩度换一群兄弟/姐妹值了。你几月开学？我帮你算军训时段🌞"},{"major":"全校通用（体测）","category":"校园生活","tags":["体测","800米","跑步","挂科","毕业","体能","补测","锻炼"],"student":"体测800米我永远不及格，大学体测难吗？挂了影响毕业不？","peer":"【同行答】大学生体质健康测试含耐力跑等项目，成绩计入体育课程，标准按国家学生体质健康标准执行。","human":"【活人回】800米是很多女生的噩梦我懂😭。体测挂了不影响毕业但影响体育成绩，别慌。秘诀就一个：提前一个月每晚跑两圈，从走跑结合开始。大一大二先把底子练起来，别等大三临时抱佛脚。实在跑不动，学校有免测/补测渠道，找体育老师聊。你平时运动不？我给你个入门计划🏃"},{"major":"全校通用（社团）","category":"校园生活","tags":["社团","招新","加几个","兴趣","简历","朋友","恋爱","耽误学习"],"student":"社团要不要加？我看招新摊位好多，加几个合适？怕耽误学习。","peer":"【同行答】我校学生社团种类丰富，建议根据兴趣参与，注意平衡学业与活动。","human":"【活人回】加1-2个就够了，别当海王加五六个（期末你会哭）。一个兴趣类（摄影/街舞/动漫）+一个实用类（新媒体/志愿者）最香，简历也好看。社团是认识跨专业朋友+谈恋爱的宝地😏。学习别荒，社团再好玩也别逃课。你啥爱好？我推荐几个靠谱的🎯"},{"major":"全校通用（图书馆）","category":"校园生活","tags":["图书馆","抢座","自习","考研","座位","预约","啬园","启东"],"student":"听说啬园图书馆抢座很卷？考研季是不是得凌晨排队？","peer":"【同行答】啬园校区图书馆为我校主图书馆，座位资源紧张时段建议错峰或使 道，找体育老师聊🏃（像英语这种也能套上）"},{"major":"全校通用（体测）","category":"校园生活","tags":["体测","800米","跑步","毕业","补测"],"student":"学长，大学体测有哪几项？我平时不运动怕过不了。","peer":"【同行答】体测含身高体重、肺活量、坐位体前屈、立定跳远、耐力跑等，标准按国家学生体质健康标准。","human":"【活人回】项目就那几样，最劝退是800/1000米。平时不运动的现在就动——每天散步+拉伸都算数。体测是过程不是审判，及格就行别焦虑。你平时运动不？我给个入门计划💪"},{"major":"全校通用（社团）","category":"校园生活","tags":["社团","招新","加几个","简历","朋友"],"student":"社团加几个合适？招新摊位好多，怕耽误学习。","peer":"【同行答】我校社团种类丰富，建议根据兴趣参与，注意平衡学业与活动。","human":"【活人回】加1-2个够了，别当海王加五六个（期末你会哭）。一个兴趣类+一个实用类（新媒体/志愿者）最香，简历也好看。社团是认识跨专业朋友+脱单宝地😏。学习别荒。你啥爱好？我推荐几个🎯"},{"major":"全校通用（社团）","category":"校园生活","tags":["社团","招新","加几个","简历","朋友","光电信息科学与工程"],"student":"冒昧问一句，社团面试难吗？我社恐怕被刷。","peer":"【同行答】学生社团招新一般含面试或体验环节，以各社团安排为准。","human":"【活人回】大多社团面试就是唠嗑，社恐也能过。挑你真喜欢的，面试官看你眼里有光就行。被刷也不丢人，还有好多社团缺人。你感兴趣哪类？我帮你挑容易进的🤝"},{"major":"全校通用（图书馆）","category":"校园生活","tags":["图书馆","抢座","自习","考研","预约"],"student":"学长，啬园图书馆抢座很卷吗？考研季要凌晨排队？👌","peer":"【同行答】啬园图书馆为主图书馆，座位紧张时段建议错峰或线上预约。","human":"【活人回】考研季确实卷，但没到凌晨排队（线上预约系统香，定闹钟抢）。平时去都有座。启东校区图书馆反而空。秘诀：早8点前到基本有座，或去院楼自习室人少。你爱泡图还是咖啡厅？我告诉你隐藏座位📖👌（像教育技术学这种也能套上）"},{"major":"全校通用（图书馆）","category":"校园生活","tags":["图书馆","抢座","自习","考研","预约","思想政治教育"],"student":"学长，平时去图书馆学习要不要预约？我怕白跑。","peer":"【同行答】我校图书馆提供座位预约系统，建议提前线上预约保障座位。","human":"【活人回】现在都有预约系统，手机点一点就行，别傻等现场。考试周提前一天约，平时随到随坐。找不到座也别慌，院楼空教室多的是。你常去哪个校区？我指你几个冷门座位📚👇（像思想政治教育这种也能套上）"},{"major":"全校通用（贫困生补助）","category":"校园生活","tags":["贫困生","补助","助学金","绿色通道","辅导员","启秀"],"student":"家里条件一般，大学有没有补助？不好意思问老师。","peer":"【同行答】我校设国家助学金、励志奖学金及绿色通道等，经济困难学生可依规申请。","human":"【活人回】先说：申请补助一点不丢人，是你应得的。国家助学金、励志奖学金、绿色通道都有，开学找辅导员拿表。别不好意思——辅导员巴不得你主动问。勤工俭学岗位也多。具体流程评论区问我，陪你走一遍🤝🎯（像医学影像学这种也能套上）"},{"major":"全校通用（贫困生补助）","category":"校园生活","tags":["贫困生","补助","助学金","绿色通道","辅导员","啬园"],"student":"求问，绿色通道是啥？我家一时凑不齐学费怎么办👇","peer":"【同行答】绿色通道为家庭经济困难新生缓交学费先入学的政策，入学后依规申请资助。","human":"【活人回】绿色通道就是'先上学后补费'，开学前在通知书里填表就行，别因为钱放弃。入学后助学金/助学贷款跟上，压力能缓。这事不丢人，不少同学都走这条。需要材料清单我发你📝😂（像服装与服饰设计这种也能套上）"},{"major":"全校通用（恋爱）","category":"校园生活","tags":["恋爱","脱单","社团","图书馆","学业"],"student":"学长，大学谈恋爱现实吗？还是先搞学业？怕 y":"校园生活","tags":["军训","防晒","体能","内务","叠被子"],"student":"学长，军训多久啊？晒不晒？体能差会不会被骂✨","peer":"【同行答】新生军训一般2-3周，含队列训练、内务整理等，以学校当年安排为准。","human":"【活人回】大概两三周，南通夏天晒是真的（防晒霜+大容量水壶备上！）。体能差别怕，教官要态度不是标准。内务叠被子才是真折磨😅。军训认识同班最快，别闷着主动唠。晒黑俩度换一群兄弟值了🌞👌"},{"major":"全校通用（军训）","category":"校园生活","tags":["军训","防晒","体能","内务","叠被子","集成电路设计与集成系统"],"student":"在线等，军训要带啥？怕漏了到时候抓瞎。","peer":"【同行答】军训用品清单以辅导员/连队通知为准，一般包括军训服、鞋袜等。","human":"【活人回】防晒霜（必带！）、大容量水壶、软鞋垫（军训鞋硬到怀疑人生）、别针、湿巾。其余连队发。提前买好别等当天。你几月开学？我帮你算军训时段🧴（像集成电路设计与集成系统这种也能套上）"},{"major":"全校通用（体测）","category":"校园生活","tags":["体测","800米","跑步","毕业","补测"],"student":"求问，体测800米我永远不及格，大学体测难吗？挂了影响毕业不？","peer":"【同行答】大学生体质健康测试含耐力跑等项目，成绩计入体育课程，按国家标准执行。","human":"【活人回】800米是很多人的噩梦我懂😭。体测挂了不影响毕业但影响体育成绩，别慌。秘诀：提前一个月每晚跑两圈，走跑结合开始。大一大二练底子，别等大三抱佛脚。跑不动有免测/补测渠道，找体育老师聊🏃👇（像应用化学这种也能套上）"},{"major":"全校通用（体测）","category":"校园生活","tags":["体测","800米","跑步","毕业","补测","口腔医学","启秀"],"student":"大学体测有哪几项？我平时不运动怕过不了。","peer":"【同行答】体测含身高体重、肺活量、坐位体前屈、立定跳远、耐力跑等，标准按国家学生体质健康标准。","human":"【活人回】项目就那几样，最劝退是800/1000米。平时不运动的现在就动——每天散步+拉伸都算数。体测是过程不是审判，及格就行别焦虑。你平时运动不？我给个入门计划💪😂（像口腔医学这种也能套上）"},{"major":"全校通用（社团）","category":"校园生活","tags":["社团","招新","加几个","简历","朋友","海洋技术","启东"],"student":"想问下，社团加几个合适？招新摊位好多，怕耽误学习📚","peer":"【同行答】我校社团种类丰富，建议根据兴趣参与，注意平衡学业与活动。","human":"【活人回】加1-2个够了，别当海王加五六个（期末你会哭）。一个兴趣类+一个实用类（新媒体/志愿者）最香，简历也好看。社团是认识跨专业朋友+脱单宝地😏。学习别荒。你啥爱好？我推荐几个🎯（像海洋技术这种也能套上）"},{"major":"全校通用（社团）","category":"校园生活","tags":["社团","招新","加几个","简历","朋友","启秀"],"student":"在线等，社团面试难吗？我社恐怕被刷。","peer":"【同行答】学生社团招新一般含面试或体验环节，以各社团安排为准。","human":"【活人回】大多社团面试就是唠嗑，社恐也能过。挑你真喜欢的，面试官看你眼里有光就行。被刷也不丢人，还有好多社团缺人。你感兴趣哪类？我帮你挑容易进的🤝👇"},{"major":"全校通用（图书馆）","category":"校园生活","tags":["图书馆","抢座","自习","考研","预约"],"student":"在线等，啬园图书馆抢座很卷吗？考研季要凌晨排队？🎯","peer":"【同行答】啬园图书馆为主图书馆，座位紧张时段建议错峰或线上预约。","human":"【活人回】考研季确实卷，但没到凌晨排队（线上预约系统香，定闹钟抢）。平时去都有座。启东校区图书馆反而空。秘诀：早8点前到基本有座，或去院楼自习室人少。你爱泡图还是咖啡厅？我告诉你隐藏座位📖（像测控技术与仪器这种也能套上）"},{"major":"全校通用（图书馆）","category":"校园生活","tags":["图书馆","抢座","自习","考研","预约","啬园"],"student":"学长，平时去图书馆学习要不要预约？我怕白跑。","peer":"【同行答】我校图书馆提供座 ,"human":"【活人回】大二下开始找第一份实习最稳（大一大一别急，先把绩点搞上来）。简历别空着，社团/项目/证书都写。南通本地企业（中天科技/通富微电）实习机会多。你啥专业？我帮你看去哪投📋🤝（像历史学这种也能套上）"},{"major":"全校通用（教资）","category":"考研与考公","tags":["教资","教师资格","师范","考证","老师","经济统计学"],"student":"师范生必须考教资吗？非师范能考老师不？👇","peer":"【同行答】中小学教师资格须参加国家教师资格考试；非师范生符合条件也可报考。","human":"【活人回】师范生毕业也要自己考教资（不是直接发）。非师范想当老师也能考，但竞争大。大三开始准备，笔试+面试+普通话。想走师范的粉笔字现在练。你想当哪科老师？我捋流程📝（像经济统计学这种也能套上）"},{"major":"全校通用（法考）","category":"考研与考公","tags":["法考","律师","考证","法学","过关","地理科学"],"student":"法学必须过法考吗？不过是不是白读？","peer":"【同行答】法律职业资格考试为从事特定法律职业的准入考试，通过率约15%（网传参考）。","human":"【活人回】法考是法学的'护城河'——过了公检法/法务/律所随便挑，不过路窄很多但不至于白读（考公/法务助理也行）。15%是裸考率，认真准备真没那么吓。想清楚愿不愿意为一张证熬两年。你大几？我给备考节奏⚖️"},{"major":"全校通用（考研线）","category":"考研与考公","tags":["考研","时间线","准备","大三","复习","环境科学"],"student":"冒昧问一句，考研完整时间线是啥？我怕错过关键节点👇","peer":"【同行答】考研含报名、初试、复试等环节，时间以研招网公告为准。","human":"【活人回】大三下定方向→暑假集中复习→9月预报名→12月初试→次年2月出分→3月复试/调剂。别等大三才想，大二就得攒绩点和科研/竞赛。数学英语是地基。你目标哪个学校？我帮你倒推计划🗓️📚（像环境科学这种也能套上）"},{"major":"全校通用（考公）","category":"考研与考公","tags":["考公","公务员","岗位","行测","申论"],"student":"学长，考公大几准备？行测申论好难。","peer":"【同行答】公务员考试含行测与申论，相关专业岗位覆盖面广。","human":"【活人回】大三再系统刷行测申论不迟，但党员/绩点/学生干部现在就攒（考公看这些）。行测靠刷题手感，申论靠积累。法考和考公可并行。你哪个专业？党员了吗？这俩决定节奏📝（像临床医学这种也能套上）"},{"major":"全校通用（分流）","category":"转专业与分流","tags":["大类","分流","绩点","志愿","方向","啬园"],"student":"想问下，我是大类招生的，啥时候分流？怕分到不喜欢的方向👇","peer":"【同行答】大类招生学生一般在低年级结束后按成绩与志愿分流，以学院方案为准。","human":"【活人回】分流一般大一下或大二上，看绩点+志愿。想避开不喜欢的方向，大一绩点就是命——别信'大学60分万岁'。提前打听往届分流线有的放矢。你哪个大类？我帮你查往年怎么分📊（像产品设计这种也能套上）"},{"major":"全校通用（分流）","category":"转专业与分流","tags":["大类","分流","绩点","志愿","方向"],"student":"想问下，被调剂到冷门专业，还有机会换吗？🎯","peer":"【同行答】我校转专业有3次机会、转出零门槛，需参加英语笔试，以当年通知为准。","human":"【活人回】有戏！转专业3次机会、转出零门槛是真良心，但热门转入竞争大。大一别摆烂，绩点越高越好转。英语笔试刷六级题。想换就大一上冲。你现在是啥专业？我帮你看转入门槛🚪（像高分子材料与工程这种也能套上）"},{"major":"全校通用（生活费）","category":"校园生活","tags":["生活费","钱","食堂","消费","省钱","贫困生"],"student":"学长，南通一个月生活费多少够？我妈给1500说够，我怕不够。","peer":"【同行答】南通消费水平属中等，校内食堂餐均约10-15元，住宿费及杂费以录取通知书为准。","human":"【活人回】1500在南通真够（前提别天天外卖+奶茶自由😂）。食堂便宜，啬园俩食堂轮着吃。想宽松2000舒服，2500+算小资。省钱秘诀：食堂>外卖，图书馆蹭空调>商场。贫困生有助学金别硬撑。你妈给多少先花着，月底见底了来问我咋省💰🚀"},{"major":"全校通用（生活费）","category":"校园生活","tags":["生活费","钱","食堂","消费","省钱","贫困生","机器人工程","啬园"],"student":"学长，大学能不能做兼职赚生活费？我不好意思跟家里多要。","peer":"【同行答】我校设有勤工俭学岗位，经济困难学生可申请，具体以资助中心通知为准。","human":"【活人回】能，但别本末倒置——学习第一位。勤工俭学岗位（图书馆/行政助理）边赚边攒经验，比校外发传单香。也别不好意思，这是你应得的。想做啥类型？评论区说，我指路🤝（像机器人工程这种也能套上）"},{"major":"全校通用（军训）","category":"校园生活","tags":["军训","防晒","体能","内务","叠被子"],"student":"在线等，军训多久啊？晒不晒？体能差会不会被骂🚀","peer":"【同行答】新生军训一般2-3周，含队列训练、内务整理等，以学校当年安排为准。","human":"【活人回】大概两三周，南通夏天晒是蛮（防晒霜+大容量水壶备上！）。体能差别怕，教官要态度不是标准。内务叠被子才是真折磨😅。军训认识同班最快，别闷着主动唠。晒黑俩度换一群兄弟值了🌞（像智能制造工程这种也能套上）"},{"major":"全校通用（军训）","category":"校园生活","tags":["军训","防晒","体能","内务","叠被子"],"student":"军训要带啥？怕漏了到时候抓瞎。","peer":"【同行答】军训用品清单以辅导员/连队通知为准，一般包括军训服、鞋袜等。","human":"【活人回】防晒霜（必带！）、大容量水壶、软鞋垫（军训鞋硬到怀疑人生）、别针、湿巾。其余连队发。提前买好别等当天。你几月开学？我帮你算军训时段🧴📚（像社会体育指导与管理这种也能套上）"},{"major":"全校通用（体测）","category":"校园生活","tags":["体测","800米","跑步","毕业","补测","口腔医学","启秀"],"student":"冒昧问一句，体测800米我永远不及格，大学体测难吗？挂了影响毕业不？✨","peer":"【同行答】大学生体质健康测试含耐力跑等项目，成绩计入体育课程，按国家标准执行。","human":"【活人回】800米是不少人的噩梦我懂😭。体测挂了不影响毕业但影响体育成绩，别慌。秘诀：提前一个月每晚跑两圈，走跑结合开始。大一大二练底子，别等大三抱佛脚。跑不动有免测/补测渠道，找体育老师聊🏃✨"},{"major":"全校通用（体测）","category":"校园生活","tags":["体测","800米","跑步","毕业","补测"],"student":"冒昧问一句，大学体测有哪几项？我平时不运动怕过不了。","peer":"【同行答】体测含身高体重、肺活量、坐位体前屈、立定跳远、耐力跑等，标准按国家学生体质健康标准。","human":"【活人回】项目就那几样，最劝退是800/1000米。平时不运动的现在就动——每天散步+拉伸都算数。体测是过程不是审判，及格就行别焦虑。你平时运动不？我给个入门计划💪👇"},{"major":"全校通用（社团）","category":"校园生活","tags":["社团","招新","加几个","简历","朋友","通信工程","啬园"],"student":"求问，社团加几个合适？招新摊位好多，怕耽误学习😂","peer":"【同行答】我校社团种类丰富，建议根据兴趣参与，注意平衡学业与活动。","human":"【活人回】加1-2个够了，别当海王加五六个（期末你会哭）。一个兴趣类+一个实用类（新媒体/志愿者）最香，简历也好看。社团是认识跨专业朋友+脱单宝地😏。学习别荒。你啥爱好？我推荐几个🎯（像通信工程这种也能套上）"},{"major":"全校通用（社团）","category":"校园生活","tags":["社团","招新","加几个","简历","朋友","口腔医学"],"student":"社团面试难吗？我社恐怕被刷。","peer":"【同行答】学生社团招新一般含面试或体验环节，以各社团安排为准。","human":"【活人回】大多社团面试就是唠嗑，社恐也能过。挑你真喜欢的，面试官看你眼里有光就行。被刷也不丢人，还有好多社团缺人。你感兴趣哪类？我帮你挑容易进的🤝🚀"},{"major":"全校通用（图书馆）","category":"校园生活","tags":["图书馆","抢座","自习","考研","预约","会计学"],"student":"在线等，啬园图书馆抢座很卷吗？考研季要凌晨排队？","peer":"【同行答】啬园图书馆为主图书馆，座位紧张时段建议错峰或线上预约。","human":"【活人回】考研季确实卷，但没到凌晨排队（线上预约系统香，定闹钟抢）。平时去都有座。启东校区图书馆反而空。秘诀：早8点前到基本有座，或去院楼自习室人少。你爱泡图还是咖啡厅？我告诉你隐藏座位📖✨"},{"major":"全校通用（图书馆）","category":"校园生活","tags":["图书馆","抢座","自习","考研","预约","应用化学"],"student":"求问，平时去图书馆学习要不要预约？我怕白跑📚","peer":"【同行答】我校图书馆提供座位预约系统，建议提前线上预约保障座位。","human":"【活人回】现在都有预约系统，手机点一点就行，别傻等现场。考试周提前一天约，平时随到随坐。找不到座也别慌，院楼空教室多的是。你常去哪个校区？我指你几个冷门座位📚"},{"major":"全校通用（贫困生补助）","category":"校园生活","tags":["贫困生","补助","助学金","绿色通道","辅导员","国际经济与贸易","啬园"],"student":"在线等，家里条件一般，大学有没有补助？不好意思问老师。","peer":"【同行答】我校设国家助学金、励志奖学金及绿色通道等，经济困难学生可依规申请。","human":"【活人回】先说：申请补助一点不丢人，是你应得的。国家助学金、励志奖学金、绿色通道都有，开学找辅导员拿表。别不好意思——辅导员巴不得你主动问。勤工俭学岗位也多。具体流程评论区问我，陪你走一遍🤝😂"},{"major":"全校通用（贫困生补助）","category":"校园生活","tags":["贫困生","补助","助学金","绿色通道","辅导员"],"student":"学长，绿色通道是啥？我家一时凑不齐学费怎么办🚀","peer":"【同行答】绿色通道为家庭经济困难新生缓交学费先入学的政策，入学后依规申请资助。","human":"【活人回】绿色通道就是'先上学后补费'，开学前在通知书里填表就行，别因为钱放弃。入学后助学金/助学贷款跟上，压力能缓。这事不丢人，很多同学都走这条。需要材料清单我发你📝"},{"major":"全校通用（恋爱）","category":"校园生活","tags":["恋爱","脱单","社团","图书馆","学业"],"student":"大学谈恋爱现实吗？还是先搞学业？怕耽误又怕错过。","peer":"【同行答】大学生恋爱属个人生活，建议在处理好学业基础上健康交往。","human":"【活人回】哈哈这题我会。大学恋爱最纯粹，但也最容易因没规划翻车。学业是底色，恋爱是调味——别本末倒置。遇到对的别因怕耽误硬拒，遇到错的别因孤独硬凑。图书馆、社团、老乡会都是天然脱单场😏。你母胎solo还是暧昧中？评论区唠💕🎯"},{"major":"全校通用（恋爱）","category":"校园生活","tags":["恋爱","脱单","社团","图书馆","学业"],"student":"在南通大学脱单容易吗？哪个校区好找对象？👌","peer":"【同行答】我校学生社团与活动丰富，利于拓展交际圈。","human":"【活人回】啬园人多热闹脱单率高，启东安静适合谈细水长流😂。社团、老乡会、选修课都是机会。别为了脱单硬撩，先把自己活得有意思，对的人自然来。你啥专业？我看看你院男女比例👀💪"},{"major":"全校通用（宿舍关系）","category":"校园生活","tags":["宿舍","室友","关系","矛盾","作息","酒店管理"],"student":"求问，宿舍室友作息不一样咋办？我早睡他打游戏到两点。","peer":"【同行答】宿舍生活建议通过沟通与协商达成共识，必要时可请辅导员协调。","human":"【活人回】这题太真实了😅。直接聊别忍——戴耳塞、约定安静时间、打游戏戴耳机，都是解法。别憋出矛盾才爆发。好室友是处出来的。你试过沟通没？我教你话术🤝😂"},{"major":"全校通用（宿舍关系）","category":"校园生活","tags":["宿舍","室友","关系","矛盾","作息","交通设备与控制工程"],"student":"冒昧问一句，和室友处不来要不要申请换宿舍？","peer":"【同行答】学生可申请调整宿舍，具体流程以宿舍管理中心规定为准。","human":"【活人回】处不来别硬扛，换宿舍是选项但不是首选。先试着聊一次，很多误会是没说开。真合不来再申请，别拖到影响学习。你因为啥合不来？说说我帮你判断值不值得换🛏️"}];
const main2=document.getElementById('content2');
const search2=document.getElementById('search2');
const clearBtn2=document.getElementById('clear2');
const chips2=document.getElementById('chips2');
const stats=document.getElementById('stats');
let activeCat2='全部';
let curList=[];
let shown=0;
const PAGE=40;
function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function highlight(text, terms){
  if (!terms.length) return text;
  let out = text;
  terms.forEach(t => { const re = new RegExp('(' + escapeRe(t) + ')', 'gi'); out = out.replace(re, '<mark>$1</mark>'); });
  return out;
}
function debHay(d){
  return [d.major,d.category,(d.tags||[]).join(' '),d.student,d.peer,d.human].join(' ').toLowerCase();
}
function render2(filter='', cat='全部'){
  const terms=filter.trim().split(/\s+/).filter(Boolean).map(t=>t.toLowerCase());
  curList=DEB.filter(d=>{
    if (cat!=='全部' && d.category!==cat) return false;
    if (!terms.length) return true;
    return terms.every(t=>debHay(d).includes(t));
  });
  shown=0;
  main2.innerHTML='';
  if (!curList.length){ main2.innerHTML='<div class="empty">没搜到相关评论场景，换个词试试（可试：医生 / 码农 / 老师 / 考编 / 杏林 / 芯片 / 课表 / 生活费）</div>'; stats.textContent=''; return; }
  appendMore();
}
function appendMore(){
  const oldBtn=main2.querySelector('.loadmore');
  if(oldBtn) oldBtn.remove();
  const next=curList.slice(shown, shown+PAGE);
  const frag=document.createDocumentFragment();
  next.forEach(d=>{
    const card=document.createElement('div'); card.className='debate';
    card.innerHTML=`
      <div class="debate-head">
        <span class="debate-major">${highlight(d.major,curTerms())}</span>
        <span class="debate-cat">${d.category}</span>
      </div>
      <div class="debate-tags">${(d.tags||[]).map(t=>`<span>${highlight(t,curTerms())}</span>`).join('')}</div>
      <div class="bubble">
        <div class="avatar av-stu">同</div>
        <div class="bubble-body"><div class="bubble-name">同学提问</div><div class="bubble-text">${highlight(d.student,curTerms())}</div></div>
      </div>
      <div class="bubble peer">
        <div class="avatar av-peer">行</div>
        <div class="bubble-body"><div class="bubble-name">同行（数据腔）</div><div class="bubble-text">${highlight(d.peer,curTerms())}</div></div>
      </div>
      <div class="bubble human">
        <div class="avatar av-human">活</div>
        <div class="bubble-body"><div class="bubble-name">活人答（网感·拉好感）</div><div class="bubble-text">${highlight(d.human,curTerms())}</div></div>
      </div>`;
    frag.appendChild(card);
  });
  shown+=next.length;
  stats.textContent=`共 ${DEB.length} 个场景 · 当前显示 ${shown}/${curList.length}`;
  if(shown<curList.length){
    const btn=document.createElement('button');
    btn.className='loadmore';
    btn.textContent=`加载更多（还剩 ${curList.length-shown} 条）`;
    btn.onclick=appendMore;
    frag.appendChild(btn);
  }
  main2.appendChild(frag);
}
let _terms=[];
function curTerms(){ return _terms; }
function setTerms(filter){
  _terms=filter.trim().split(/\s+/).filter(Boolean).map(t=>t.toLowerCase());
}
function renderChips2(){
  const cats=['全部',...Array.from(new Set(DEB.map(d=>d.category)))];
  chips2.innerHTML=cats.map(c=>`<div class="chip ${c===activeCat2?'active':''}" data-cat="${c}">${c}</div>`).join('');
  chips2.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{activeCat2=el.dataset.cat;renderChips2();setTerms(search2.value);render2(search2.value,activeCat2);});
}
search2.addEventListener('input',e=>{clearBtn2.style.display=e.target.value?'block':'none';setTerms(e.target.value);render2(e.target.value,activeCat2);});
clearBtn2.onclick=()=>{search2.value='';clearBtn2.style.display='none';setTerms('');render2('',activeCat2);};
renderChips2(); setTerms(''); render2();
document.getElementById('toTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
window.onscroll=()=>{document.getElementById('toTop').style.display=window.scrollY>300?'block':'none';};
</script>
